name: CI

# This repository had no CI at all: `npm run verify` existed, was strong, and
# nothing ran it except by hand. A gate nobody runs is not a gate.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  vendored-crypto:
    name: Crypto — unchanged from the web client
    runs-on: ubuntu-latest
    # The whole anti-drift argument for this app rests on `src/crypto/` being a
    # byte-identical copy of the web client's. Nothing checked that; it was true
    # only because it kept being re-checked by hand.
    #
    # The web client lives in a private repository, so this job cannot fetch it.
    # What it can do is prove the copy here is self-consistent: the web client's
    # own crypto tests are vendored alongside it and must pass unmodified.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/__tests__/crypto.keys src/__tests__/crypto.mnemonic src/__tests__/crypto.ratchet src/__tests__/crypto.safetyNumber

  verify:
    name: Full verify (tests + device sim + export)
    runs-on: ubuntu-latest
    # `npm run verify` is the gate this repository already trusted locally:
    # unit tests, the device simulation, the negative case that proves the
    # simulation can fail, and a real Expo export. It just never ran anywhere
    # but on Bogdan's machine.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  secret-scan:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A secret that was committed and then removed is still in the objects
          # being pushed, so the history is what gets scanned, not the tip.
          fetch-depth: 0
      # The gitleaks *action* requires a paid licence for organisation-owned
      # repositories. The CLI is MIT. Pinned by version and checked against the
      # checksum published with the release — a scanner fetched over the network
      # is itself supply chain.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan history for secrets
        # --redact so a finding is never printed into the build log, which would
        # publish the very thing the job exists to catch.
        run: gitleaks git --redact --no-banner --log-opts="--all" .

  dep-audit:
    name: Dependencies — Advisory audit
    runs-on: ubuntu-latest
    # This job was deliberately left out when CI was first added: `npm audit`
    # reported 22 advisories under the Expo toolchain, and a gate that is red on
    # the day it lands is how gates get switched off. The tree is clean now —
    # `postcss`, `tar` and `uuid` pinned through `overrides`, `@xmldom/xmldom`
    # to ^0.9.8, `esbuild` and `vitest` bumped — so the gate can hold the line.
    #
    # Notably this was reached *without* the Expo 52 → 57 jump npm suggested.
    # That is five majors and a React Native upgrade underneath it, which is a
    # planned migration, not an audit fix.
    #
    # Two thresholds, matching the web repositories: the production tree fails
    # at moderate, the full tree including build and test tooling at high.
    strategy:
      fail-fast: false
      matrix:
        tree: [production, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Production tree (moderate+ fails)
        if: matrix.tree == 'production'
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full tree incl. dev tooling (high+ fails)
        if: matrix.tree == 'full'
        run: npm audit --audit-level=high
